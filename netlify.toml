[build]
  command = "cd frontend && npm install && npm run build"
  publish = "frontend/dist"

[build.environment]
  PYTHON_VERSION = "3.11"

# Proxy all /api/* requests to the Render backend
[[redirects]]
  from   = "/api/*"
  to     = "https://riskiq-backend-rwo9.onrender.com/api/:splat"
  status = 200
  force  = true

# SPA fallback — all other routes serve the React app
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

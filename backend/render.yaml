services:
  - type: web
    name: riskiq-backend
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 1 -k uvicorn.workers.UvicornWorker main:app --bind 0.0.0.0:$PORT --timeout 120
    healthCheckPath: /health
    envVars:
      - key: ADMIN_EMAIL
        value: safehorizonadvisory@gmail.com
      - key: ADMIN_PASSWORD
        value: Ayush@6860
      - key: ADMIN_SECRET_KEY
        value: riskiq-admin-2025-secure
      - key: SECRET_KEY
        value: riskiq-super-secret-key-2024-production
      - key: DATABASE_URL
        value: sqlite:///./riskiq.db
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: ALLOWED_ORIGINS
        value: "https://riskiq-platform-644.netlify.app,http://localhost:5173"
